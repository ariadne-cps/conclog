name: Coverage

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
            name: "macOS 26 AppleClang 21 [Coverage]",
            os: macos-26,
            cxx: "/usr/bin/clang++"
          }
          - {
            name: "Ubuntu 24.04 GCC 13 [Coverage]",
            os: ubuntu-24.04,
            cxx: "g++-13"
          }

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Get macOS Concurrency
      if: runner.os == 'macOS'
      run: echo NPROC="sysctl -n hw.ncpu" >> $GITHUB_ENV

    - name: Get Linux Concurrency
      if: runner.os == 'Linux'
      run: echo NPROC="nproc" >> $GITHUB_ENV

    - name: Set Up macOS Dependencies
      if: runner.os == 'macOS'
      run: brew install ninja pkg-config gnupg

    - name: Set Up Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build pkg-config lcov g++-13

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      working-directory: ${{runner.workspace}}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{matrix.config.cxx}} -G "Ninja" -DCOVERAGE=ON

    - name: Build, Test and Generate Code Coverage
      working-directory: ${{runner.workspace}}/build
      run: cmake --build . --parallel $($NPROC) --target coverage

    - name: Upload Code Coverage
      if: runner.os == 'macOS'
      uses: codecov/codecov-action@v7.1.1
      with:
        files: ${{runner.workspace}}/build/coverage.info
        disable_search: true
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
